name: Publish to npm

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Só publica quando a versão do package.json ainda não existe no npm
      - name: Check version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "rhyla@${VERSION}" version >/dev/null 2>&1; then
            echo "rhyla@${VERSION} already published, skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

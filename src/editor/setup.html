<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set up the docs · Rhyla</title>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('rhyla-theme'); } catch (e) {}
      var theme = saved === 'dark' || saved === 'light' ? saved
        : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/__rhyla/editor/setup.css">
</head>
<body class="su">
  <div class="su-shell">
    <aside class="su-side">
      <div class="su-side-top">
        <span class="su-logo">
          <span class="rh-brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
          </span>
          Rhyla
        </span>
        <button type="button" class="su-icon-btn" id="su-theme" aria-label="Toggle dark mode">
          <svg class="su-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="su-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>

      <section class="su-project" id="su-project" hidden>
        <span class="su-eyebrow" id="su-project-label"></span>
        <h2 class="su-project-name" id="su-project-name"></h2>
        <dl class="su-metrics" id="su-metrics"></dl>
        <div class="su-routes" id="su-routes"></div>
      </section>

      <nav class="su-steps-wrap" aria-label="Steps">
        <ol class="su-steps" id="su-steps"></ol>
      </nav>
    </aside>

    <main class="su-main">
      <div class="su-mobile-bar" aria-hidden="true"><i id="su-mobile-fill"></i></div>
      <div class="su-stage" id="su-stage" aria-live="polite">
        <p class="su-loading">…</p>
      </div>
      <footer class="su-nav" id="su-nav" hidden>
        <button type="button" class="su-btn su-btn-ghost" id="su-back"></button>
        <span class="su-error" id="su-error" role="alert"></span>
        <span class="su-hint" id="su-hint"></span>
        <button type="button" class="su-btn su-btn-primary" id="su-next"></button>
      </footer>
    </main>
  </div>

  <script type="module" src="/__rhyla/editor/setup.js"></script>
</body>
</html>

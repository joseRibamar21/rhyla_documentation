<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="rhyla-ui" content="2">
  <meta name="rhyla-lang" content="en">
  <title>Rhyla Docs</title>
  <link rel="stylesheet" href="/styles/global.css">
  <link id="theme-style" rel="stylesheet" href="/styles/light.css">
  <link rel="stylesheet" href="/styles/page-generator.css">
  <link rel="icon" type="image/x-icon" href="/public/favicon.ico">
  <!-- Runs before first paint: resolves the base path and applies the theme (no flash) -->
  <script>
    (function () {
      try {
        var meta = document.querySelector('meta[name="rhyla-base"]');
        var prefix = (meta && meta.getAttribute('content')) || '/';
        if (prefix.slice(-1) !== '/') prefix += '/';
        window.__rhyla_prefix__ = prefix;

        var saved = null;
        try { saved = localStorage.getItem('rhyla-theme'); } catch (e) {}
        var theme = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);

        var globalCss = document.querySelector('link[href$="/styles/global.css"]');
        if (globalCss) globalCss.href = prefix + 'styles/global.css';
        var themeCss = document.getElementById('theme-style');
        if (themeCss) themeCss.href = prefix + 'styles/' + theme + '.css';
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <header class="rhyla-header">
    <button id="menu-toggle" class="rh-icon-btn rh-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>

    <!-- Brand: replace the mark with <img src="/public/logo.png" alt=""> to use your own logo -->
    <a class="rhyla-brand" href="/">
      <span class="rh-brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
      </span>
      <span id="rhyla-title" class="rh-brand-title">Rhyla Docs</span>
    </a>

    <div class="rhyla-actions">
      <button id="search-open" class="rh-search-trigger" type="button" aria-label="Search (Ctrl+K)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg>
        <span>Search docs…</span>
        <kbd class="rh-kbd" data-shortcut>Ctrl K</kbd>
      </button>
      <button id="theme-toggle" class="rh-icon-btn rh-theme-toggle" type="button" data-icon aria-label="Toggle dark mode">
        <svg class="rh-icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="rh-icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="rh-nav-backdrop" data-close-nav></div>

  <!-- Search dialog -->
  <div id="search-overlay" class="rh-search-overlay" aria-hidden="true">
    <div class="rh-search-backdrop" data-close-overlay></div>
    <div class="rh-search-panel" role="dialog" aria-modal="true" aria-label="Search documentation">
      <div class="rh-search-input-wrap">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg>
        <input id="search-input" type="search" placeholder="Search documentation…" autocomplete="off" spellcheck="false" />
        <button id="search-close" class="rh-search-close" type="button" aria-label="Close search"><kbd class="rh-kbd">Esc</kbd></button>
      </div>
      <div class="rh-search-meta" id="search-meta"></div>
      <div class="rh-search-results" id="search-results" role="listbox"></div>
      <div class="rh-search-footer" aria-hidden="true">
        <span><kbd class="rh-kbd">↑</kbd><kbd class="rh-kbd">↓</kbd> navigate</span>
        <span><kbd class="rh-kbd">↵</kbd> open</span>
        <span><kbd class="rh-kbd">Esc</kbd> close</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var s = document.createElement('script');
      s.src = (window.__rhyla_prefix__ || '/') + 'scripts/header-runtime.js';
      document.body.appendChild(s);
    })();
  </script>
